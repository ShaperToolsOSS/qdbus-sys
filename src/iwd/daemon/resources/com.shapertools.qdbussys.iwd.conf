<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <allow send_destination="com.shapertools.qdbussys.iwd" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.shapertools.qdbussys.iwd" send_interface="com.shapertools.qdbussys.iwd1" send_member="GetSnapshot"/>
    <allow send_destination="com.shapertools.qdbussys.iwd" send_interface="com.shapertools.qdbussys.iwd1" send_member="ReleaseClient"/>
  </policy>
  <policy group="netdev">
    <allow send_destination="com.shapertools.qdbussys.iwd" send_interface="com.shapertools.qdbussys.iwd1"/>
  </policy>
  <policy user="root">
    <allow own="com.shapertools.qdbussys.iwd"/>
    <allow send_destination="com.shapertools.qdbussys.iwd"/>
  </policy>
</busconfig>
