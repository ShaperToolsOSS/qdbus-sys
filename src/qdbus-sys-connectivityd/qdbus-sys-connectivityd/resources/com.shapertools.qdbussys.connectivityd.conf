 <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="com.shapertools.qdbussys.connectivityd"/>
    <allow send_destination="com.shapertools.qdbussys.connectivityd"/>
  </policy>

  <!-- Other users can read state and request a (rate-limited) check -->
  <policy context="default">
    <allow send_destination="com.shapertools.qdbussys.connectivityd"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.shapertools.qdbussys.connectivityd"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="com.shapertools.qdbussys.connectivityd"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="com.shapertools.qdbussys.connectivityd"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="com.shapertools.qdbussys.connectivityd"
           send_interface="com.shapertools.qdbussys.connectivityd1" send_member="checkConnectivity"/>
  </policy>
</busconfig>
