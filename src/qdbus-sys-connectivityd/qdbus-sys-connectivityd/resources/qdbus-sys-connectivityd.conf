[General]
verboseDebugging=false

[Connectivity]
; Configure the service whose reachability determines the connected state.
endpointUrl=https://connectivitycheck.gstatic.com/generate_204
; Optional HTTP status and exact UTF-8 response body checks.
expectedStatusCode=204
; An explicitly empty response requires an empty body; omit the key to skip checking it.
expectedResponse=""
; Any successful lookup establishes that DNS resolution works.
dnsTestDomains=google.com, baidu.com, cloudflare.com, shapertools.com
; Seconds between quiet revalidations of a settled result; 0 disables them.
recheckIntervalSec=60
